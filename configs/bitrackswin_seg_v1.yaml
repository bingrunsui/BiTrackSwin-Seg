# Provenance configuration for the v1 model-zoo checkpoint.
# This records the epoch-95 RAW reference recipe; it is not a dataset distribution.

model:
  name: BiTrackSwinSegV1
  task: binary_semantic_segmentation
  input_mode: all
  input_channels: 5
  band_names: [Red, Green, Blue, RedEdge, NIR]
  num_classes: 2
  ignore_index: 255
  image_size: [256, 256]
  backbone:
    type: three_stage_swinv2_bilevel
    embed_dim: 96
    depths: [4, 6, 2]
    num_heads: [6, 6, 12]
    window_sizes: [8, 8, 32]
    drop_path: 0.3
    stem: conv
    stage0_to_decoder: true
    cross_window:
      enabled: true
      type: hybrid
      top_k: 4
      num_queries: 3
      summary_statistics: [max, mean, min]
      step3: splat_plus
      bilevel_stages: [1]
      implementation: v24
      top_k_windows: 9
      pool_heads: 8
      exchange_heads: 8
      retrieval_heads: 12
      tau_min: 0.9
      gamma_init: 0.5
      exchange_layerscale_init: 0.0001
      depthwise_convolution: true
      ffn_enabled: true
      ffn_respost: true
      drop_cross_input_norm: true
      multiplicative_track_layer_norm: true
      cross_qk_norm: true
    layerscale:
      enabled: true
      init: 0.01
    swin_version: v2
    use_swiglu: true
    use_qk_norm: true
    use_rope: true
    cosine_drop_path: true
    cross_stage_mode: none
  decoder:
    type: unet
    channels: 256
    attention_gate: false
  pretrained:
    swin: null
    auxiliary: null

data:
  root: data
  image_dir: images
  label_dir: labels
  train_manifest: splits/v1_train.txt
  val_manifest: splits/v1_val.txt
  manifest_format: one_relative_sample_id_per_line
  label_mapping: {0: 0, 1: 1, 255: 255}
  nodata_threshold: -999.0
  normalization:
    mode: global_robust_zscore
    clip: [-10.0, 10.0]
    mean: [0.028280708557294337, 0.02386101610249177, 0.023194603094527436, 0.03496641793840186, 0.032461613026372266]
    std: [0.006840331269310518, 0.005882098063962766, 0.005807204197407578, 0.008077255819901133, 0.007232906989578378]
  augmentation:
    scale_range: [0.5, 2.0]
    gaussian_noise_std: 0.02
    mosaic_probability: 0.3
    copy_paste_probability: 0.5
    foreground_aware_crop_probability: 0.5

train:
  epochs: 100
  batch_size: 2
  accumulation_steps: 4
  num_workers: 2
  optimizer:
    name: AdamW
    lr: 0.0005
    weight_decay: 0.05
    backbone_random_scale: 1.0
    bilevel_scale: 0.8
  scheduler:
    name: wsd
    warmup_epochs: 5
    stable_until_epoch: 70
    decay_until_epoch: 100
    final_lr_fraction: 0.0
  loss:
    ce_weight: 1.5
    dice_weight: 2.0
    class_weights: [1.0, 5.0]
    dice_class_weights: [1.0, 5.0]
    focal: true
    focal_alpha: 0.5
    focal_gamma: 2.0
    focal_ohem: true
    ohem_keep_ratio: 0.3
    label_smoothing: 0.05
    dice_warmup_epochs: 10
    dice_ramp_epochs: 10
  ema:
    enabled: true
    decay: 0.999
  validation:
    frequency_epochs: 2
    selection_metric: miou
    release_state: raw

runtime:
  seed: 42
  device: cuda
  amp:
    enabled: true
    dtype: bfloat16
    warmup_epochs: 1
  deterministic: false
